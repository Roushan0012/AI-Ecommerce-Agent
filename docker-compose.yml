# ==============================================================================
# AI Commerce Agent - Production-like Multi-Container Orchestration (Phase 18F-3)
# ==============================================================================
# Architecture:
# - Frontend: Next.js SSR / Static Client (Containerized, non-root user)
# - Backend: FastAPI ASGI Engine (Containerized, multi-worker Uvicorn, non-root user)
# - Database: Managed PostgreSQL / Supabase (Externally hosted, SSL encrypted)
# ==============================================================================

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: ai-commerce-agent-backend:latest
    container_name: ai_commerce_backend
    restart: unless-stopped
    ports:
      - "${PORT:-8000}:8000"
    env_file:
      - ./backend/.env
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - DEBUG=false
      - HOST=0.0.0.0
      - PORT=8000
      - WEB_CONCURRENCY=${WEB_CONCURRENCY:-4}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      - RATE_LIMIT_ENABLED=${RATE_LIMIT_ENABLED:-true}
      - RATE_LIMIT_AUTH_PER_MINUTE=${RATE_LIMIT_AUTH_PER_MINUTE:-10}
      - RATE_LIMIT_DEFAULT_PER_MINUTE=${RATE_LIMIT_DEFAULT_PER_MINUTE:-120}
      - MAX_REQUEST_BODY_BYTES=${MAX_REQUEST_BODY_BYTES:-2097152}
      - SECURITY_HEADERS_ENABLED=${SECURITY_HEADERS_ENABLED:-true}
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_BASE_URL=${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
        - NEXT_PUBLIC_RAZORPAY_KEY_ID=${NEXT_PUBLIC_RAZORPAY_KEY_ID:-rzp_test_placeholder}
    image: ai-commerce-agent-frontend:latest
    container_name: ai_commerce_frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - NEXT_PUBLIC_API_BASE_URL=${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
      - NEXT_PUBLIC_RAZORPAY_KEY_ID=${NEXT_PUBLIC_RAZORPAY_KEY_ID:-rzp_test_placeholder}
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      # Explicit IPv4 loopback (resolves Alpine musl IPv6 localhost connection refusal; formerly wget -qO- http://localhost:3000/)
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
